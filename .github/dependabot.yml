# Dependabot configuration for automated dependency updates
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  # Security-critical NuGet packages (checked daily)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
      - "nuget"
    commit-message:
      prefix: "security"
      include: "scope"
    # Only security updates for this config
    allow:
      - dependency-type: "all"
    # Target security vulnerabilities specifically
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    # Reviewers for security updates
    reviewers:
      - "jschell"

  # Regular NuGet package updates (weekly)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "nuget"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group minor and patch updates together
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Ignore security-only updates (handled by daily check above)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Monitor GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
