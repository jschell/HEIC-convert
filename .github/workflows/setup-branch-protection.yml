name: Setup Branch Protection

# This workflow sets up branch protection rules for the main branch
# Run manually from Actions tab or automatically on push to this file

on:
  workflow_dispatch: # Manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/setup-branch-protection.yml'
      - '.github/scripts/setup-branch-protection.sh'

permissions:
  contents: read
  # Note: This workflow requires admin permissions which GITHUB_TOKEN doesn't have
  # You need to create a Personal Access Token with repo:admin scope
  # and add it as a repository secret named BRANCH_PROTECTION_TOKEN

jobs:
  setup-protection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup branch protection rules
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # Configure branch protection using GitHub API
          echo "🔒 Configuring branch protection for main..."

          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/branches/main/protection" \
            -f required_status_checks[strict]=true \
            -f required_status_checks[contexts][]=build-and-test \
            -f required_pull_request_reviews[dismiss_stale_reviews]=true \
            -f required_pull_request_reviews[require_code_owner_reviews]=false \
            -f required_pull_request_reviews[required_approving_review_count]=1 \
            -f required_pull_request_reviews[require_last_push_approval]=false \
            -f enforce_admins=true \
            -f required_conversation_resolution=true \
            -f allow_force_pushes=false \
            -f allow_deletions=false \
            -f block_creations=false \
            -f required_linear_history=false \
            -f lock_branch=false

          echo "✅ Branch protection configured successfully!"

      - name: Verify configuration
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "📋 Current branch protection settings:"
          gh api "/repos/${{ github.repository }}/branches/main/protection" \
            --jq '.required_status_checks, .required_pull_request_reviews, .enforce_admins, .required_conversation_resolution' || true

      - name: Setup instructions
        if: failure()
        run: |
          echo "❌ Failed to set up branch protection."
          echo ""
          echo "This is likely because GITHUB_TOKEN doesn't have admin permissions."
          echo ""
          echo "To fix this, create a Personal Access Token:"
          echo "1. Go to Settings > Developer settings > Personal access tokens > Tokens (classic)"
          echo "2. Generate new token with 'repo' scope (full control)"
          echo "3. Add token as repository secret: BRANCH_PROTECTION_TOKEN"
          echo "4. Re-run this workflow"
          echo ""
          echo "Alternatively, run the script manually:"
          echo "  bash .github/scripts/setup-branch-protection.sh"
          exit 1
