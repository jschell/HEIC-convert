name: Dependabot Failure Monitor

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

permissions:
  issues: write
  pull-requests: read

jobs:
  check-dependabot-failure:
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${context.payload.workflow_run.head_branch}`
            });

            if (pulls.data.length > 0) {
              return pulls.data[0].number;
            }
            return null;

      - name: Check if issue already exists
        id: check_issue
        if: steps.pr.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependabot-failure',
              creator: 'github-actions[bot]'
            });

            const existingIssue = issues.data.find(issue =>
              issue.title.includes(`#${prNumber}`)
            );

            return existingIssue ? existingIssue.number : null;

      - name: Create issue for failed Dependabot PR
        if: steps.pr.outputs.result != 'null' && steps.check_issue.outputs.result == 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            const runUrl = context.payload.workflow_run.html_url;
            const branch = context.payload.workflow_run.head_branch;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Dependabot PR #${prNumber} Failed CI Tests`,
              labels: ['dependabot-failure', 'automated', 'needs-review'],
              body: `## Dependabot PR Test Failure

            A Dependabot pull request has failed CI tests and requires manual review.

            ### Details
            - **PR**: #${prNumber}
            - **Branch**: \`${branch}\`
            - **Failed Workflow**: [View Run](${runUrl})
            - **Actor**: @dependabot

            ### Possible Actions

            1. **Review the failure logs** to understand what broke
            2. **Check for breaking API changes** in the updated dependency
            3. **Update code** to accommodate new API if needed
            4. **Close the PR** if the update is not compatible
            5. **Add version constraints** to dependabot.yml if needed

            ### Related PR

            This issue was automatically created for PR #${prNumber}. Once the PR is merged or closed, this issue can be closed.

            ---

            🤖 *Automatically created by [Dependabot Failure Monitor workflow](${runUrl})*`
            });

            // Add comment to PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `⚠️ **CI Tests Failed**\n\nThis Dependabot PR has failed CI tests. An issue has been created to track the failure: #${issue.data.number}\n\nPlease review the test failures before merging.`
            });

      - name: Update existing issue
        if: steps.pr.outputs.result != 'null' && steps.check_issue.outputs.result != 'null'
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = ${{ steps.check_issue.outputs.result }};
            const runUrl = context.payload.workflow_run.html_url;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `🔄 **Another test failure occurred**\n\n[View latest run](${runUrl})\n\nThe Dependabot PR is still failing CI tests.`
            });
