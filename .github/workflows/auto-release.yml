name: Auto Release

# Triggers when a commit lands on main with a release keyword in the message.
# Reads the version from .csproj and creates a git tag, which triggers the
# existing release.yml workflow.
#
# Keywords (in commit or PR merge message):
#   [release]      - Create tag from current .csproj version (same as [bump patch])
#   [bump patch]   - Bump patch version (0.1.2 -> 0.1.3), update .csproj, create tag
#   [bump minor]   - Bump minor version (0.1.2 -> 0.2.0), update .csproj, create tag
#   [bump major]   - Bump major version (0.1.2 -> 1.0.0), update .csproj, create tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  auto-tag:
    if: >-
      contains(github.event.head_commit.message, '[release]') ||
      contains(github.event.head_commit.message, '[bump patch]') ||
      contains(github.event.head_commit.message, '[bump minor]') ||
      contains(github.event.head_commit.message, '[bump major]')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine bump type
        id: bump
        shell: bash
        run: |
          MESSAGE="${{ github.event.head_commit.message }}"
          if echo "$MESSAGE" | grep -q '\[bump major\]'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGE" | grep -q '\[bump minor\]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGE" | grep -q '\[bump patch\]'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          elif echo "$MESSAGE" | grep -q '\[release\]'; then
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Read and bump version
        id: version
        shell: bash
        run: |
          # Read current version from .csproj (single source of truth)
          CURRENT=$(grep -oP '(?<=<Version>)[^<]+' HEICAutoConverter.csproj)
          echo "Current version: ${CURRENT}"

          BUMP_TYPE="${{ steps.bump.outputs.type }}"

          if [ "$BUMP_TYPE" = "release" ]; then
            # [release] uses current .csproj version as-is
            NEW_VERSION="$CURRENT"
          else
            # Parse and bump
            IFS='.' read -ra PARTS <<< "$CURRENT"
            MAJOR=${PARTS[0]:-0}
            MINOR=${PARTS[1]:-0}
            PATCH=${PARTS[2]:-0}

            case $BUMP_TYPE in
              major)
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
                ;;
              minor)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              patch)
                PATCH=$((PATCH + 1))
                ;;
            esac

            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

            # Update .csproj if version changed
            if [ "$NEW_VERSION" != "$CURRENT" ]; then
              sed -i "s|<Version>${CURRENT}</Version>|<Version>${NEW_VERSION}</Version>|" HEICAutoConverter.csproj
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add HEICAutoConverter.csproj
              git commit -m "Bump version to ${NEW_VERSION}"
              git push
              echo "Bumped .csproj: ${CURRENT} -> ${NEW_VERSION}"
            fi
          fi

          TAG="v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"
          echo "Created and pushed tag: ${TAG}"
