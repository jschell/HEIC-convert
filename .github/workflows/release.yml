name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag format
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -notmatch "^v\d+\.\d+\.\d+") {
            Write-Error "Tag must be in format v#.#.# (e.g., v1.0.0)"
            exit 1
          }
          Write-Host "Tag format valid: ${{ github.ref_name }}"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore HEICAutoConverter.sln

      - name: Run tests
        run: dotnet test tests/HEICAutoConverter.Tests.csproj --configuration Release --verbosity normal

      - name: Publish self-contained executable
        run: >
          dotnet publish HEICAutoConverter.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=true
          -p:Version=${{ steps.version.outputs.VERSION }}
          --output ./publish

      # TODO: Add code signing when certificate is available
      # See WORKFLOW_IMPROVEMENTS.md section 4 for implementation details
      # - name: Sign executable
      #   shell: pwsh
      #   run: |
      #     # Code signing implementation here

      - name: Create zip archive
        shell: pwsh
        run: Compress-Archive -Path ./publish/HEICAutoConverter.exe -DestinationPath ./publish/HEICAutoConverter-${{ github.ref_name }}-win-x64.zip

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exeHash = (Get-FileHash ./publish/HEICAutoConverter.exe -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash ./publish/HEICAutoConverter-${{ github.ref_name }}-win-x64.zip -Algorithm SHA256).Hash
          $checksums = @"
          ``````
          SHA256 Checksums:
          $exeHash  HEICAutoConverter.exe
          $zipHash  HEICAutoConverter-${{ github.ref_name }}-win-x64.zip
          ``````
          "@
          echo "CHECKSUMS<<EOF" >> $env:GITHUB_OUTPUT
          echo $checksums >> $env:GITHUB_OUTPUT
          echo "EOF" >> $env:GITHUB_OUTPUT
        id: checksums

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Downloads

            | File | Description |
            |------|-------------|
            | `HEICAutoConverter.exe` | Portable single-file executable (no installation needed) |
            | `HEICAutoConverter-${{ github.ref_name }}-win-x64.zip` | Zipped portable executable |

            ## System Requirements
            - Windows 10 (1809+) or Windows 11
            - No .NET runtime installation required (self-contained)

            ${{ steps.checksums.outputs.CHECKSUMS }}
          files: |
            ./publish/HEICAutoConverter.exe
            ./publish/HEICAutoConverter-${{ github.ref_name }}-win-x64.zip
